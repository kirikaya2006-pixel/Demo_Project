<div class="page-login">
	<div class="container" id="container">

		<div class="form-container sign-up-container">
			<div class="form">
				<div class="" id="display-alert-sign_up"></div>
				<h1>Create Account</h1>
				<input class="input" type="text" id="input-username-signup" placeholder="Name">
				<input class="input" type="text" id="input-email-signup" placeholder="Email">
				<input class="input" type="password" id="input-password-signup" placeholder="Password">
				<label><input type="checkbox" id="item-checkbox"> 
					<a href="#" id="open-terms">
						<span class="text-danger">
							<b>Terms of Service</b>
						</span>
					</a>
				</label>
				<button onclick="signup()">Sign Up</button>
			</div>
		</div>

		<!-- Modal -->
		<div class="modal fade" id="termsModal" tabindex="1">
			<div class="modal-dialog modal-lg modal-dialog-scrollable">
				<div class="modal-content">
					
					<div class="modal-header">
						<h5 class="modal-title">Term of Service</h5>
						<button class="btn-close" data-bs-dismiss="modal"></button>
					</div>

					<div class="modal-body" id="terms-content">
						<div class="text-center py-5">
							<div class="spinner-border"></div>
						</div>
					</div>

				</div>
			</div>
		</div>

		<div class="form-container sign-in-container">
			<div class="form">
				<div class="" id="display-alert-sign_in"></div>
				<h1>Sign in</h1>
				<input class="input" type="text" placeholder="Email" id="input-email-signin">
				<input class="input" type="password" placeholder="Password" id="input-password-signin">
				<a href="#">Forgot your password?</a>
				<button onclick="signin()">Sign In</button>
			</div>
		</div>
		
		<div class="overlay-container">
			<div class="overlay">
				<div class="overlay-panel overlay-left">
					<h1>Welcome Back!</h1>
					<p>To keep connected with us please login with your personal info</p>
					<button class="ghost" id="signIn">Sign In</button>
				</div>
				<div class="overlay-panel overlay-right">
					<h1>Hello, Friend!</h1>
					<p>Enter your personal details and start journey with us</p>
					<button class="ghost" id="signUp">Sign Up</button>
				</div>
			</div>
		</div>
	</div>
</div>
